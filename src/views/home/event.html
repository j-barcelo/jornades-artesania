<article class="row align-items-center border-top py-3">

    <time datetime="{{ dateTime }}" class="col-12 col-sm-4 col-lg-1 border-start border-light border-3 mb-4 mb-lg-0">
        <span class="display-5 fw-bold mb-0 d-block">{{ day }}</span>
        {{ month }}
    </time>

    <div class="col-6 col-sm-4 col-lg-2 border-start ps-4 mb-4 mb-lg-0">
        <p>Ubicació</p>
        <address class=" fw-bold mb-0">{{ location }}</address>
    </div>

    <div class="col-6 col-sm-4 col-lg-2 border-start ps-4 mb-4 mb-lg-0">
        <p>Hora</p>
        <p class=" fw-bold mb-0"><time datetime="{{ hourStart }}">{{ hourStart }}</time> - <time datetime="{{ hourEnd }}">{{ hourEnd }}</time></p>
    </div>

    <div class="col-8 col-lg-5 border-start border-0 ps-4">
        <h3 class="h5 mb-0">{{ title }}</h3>
    </div>

    <div class="col-4 col-lg-2 text-lg-end p-0">
        <a href="article.html" class="btn btn-outline-light">Veure +</a>
    </div>

</article>
